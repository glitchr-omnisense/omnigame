# omnisense/omnigame with every omnigame/* provider:
#
#   docker compose run --rm omnigame test       # every package's tests (recorded answers, no network)
#   docker compose run --rm omnigame bare       # plain PHP: a registry, a search, a game, a library, ownership - and what PHP loaded
#   docker compose run --rm omnigame live       # the checks that need no key (Steam's store, GOG's catalogue, itch.io's pages), within its policies
#   docker compose run --rm omnigame phpstan    # PHPStan, each package at the highest level
#   docker compose down -v                      # the harness's volume gone
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNIGAME_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
name: omnigame-harness

services:
  omnigame:
    build: .
    image: omnisense/omnigame-harness
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnigame/core
      - ${OMNIGAME_PLUGINS:-./plugins}:/omnigame/plugins:ro
      - harness:/harness

volumes:
  harness:
